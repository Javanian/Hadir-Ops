[project]
name = "hadirops-backend"
version = "1.1.0"
description = "HadirOps attendance API: FastAPI, MongoDB, OpenCV face recognition."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161,<1",
    "uvicorn[standard]>=0.54,<1",
    "pymongo>=4.17,<5",
    "pyjwt>=2.15,<3",
    # Direct bcrypt instead of passlib, which is unmaintained and breaks on Python 3.13+
    # (it needs the removed `crypt` module and bcrypt < 4.1).
    "bcrypt>=5.0,<6",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.30",
    "limits>=5.8,<6",
    # IANA time zones for per-site time (Windows and slim images ship none)
    "tzdata>=2026.1",
    "numpy>=2.3,<3",
    # Decodes photos and runs face detection (YuNet) and recognition (SFace)
    # through its DNN module; the model files are pinned in app/services/face_models.py.
    "opencv-python-headless>=5.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.3",
    # httpx2: the maintained continuation of httpx (Pydantic), with the same API
    "httpx2>=2.16",
    "ruff>=0.17",
]

[tool.uv]
package = false
# Supply-chain cooldown: only releases that have been public for 7 days.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# A deprecation in our code or a dependency fails the run, so upgrades surface them.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::ResourceWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the documented pattern
    "E501",  # long lines are left to review
]

[tool.ruff.lint.per-file-ignores]
# These put backend/ on sys.path or set env vars before importing the app
"tests/conftest.py" = ["E402"]
"scripts/*" = ["E402"]
"seed*.py" = ["E402"]
