services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hadirops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hadirops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hadiropspass}
      POSTGRES_DB: ${DB_NAME:-hadirops}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hadirops} -d ${DB_NAME:-hadirops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: hadirops_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-hadirops}:${DB_PASSWORD:-hadiropspass}@db:5432/${DB_NAME:-hadirops}
      - DB_SCHEMA=${DB_SCHEMA:-hadirops}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - insightface_models:/root/.insightface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    container_name: hadirops_web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${WEB_API_BASE_URL:-/api}
      - VITE_API_PROXY_TARGET=${WEB_API_PROXY_TARGET:-http://backend:8000}
      - VITE_APP_NAME=HadirOps
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

  expo:
    build: ./mobile
    container_name: hadirops_expo
    restart: unless-stopped
    network_mode: host     # share host network — Metro detects Tailscale IP directly
    command: npx expo start --lan
    environment:
      - EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL:-auto}
      - EXPO_PUBLIC_API_PORT=${EXPO_PUBLIC_API_PORT:-8000}
      - EXPO_PUBLIC_API_TIMEOUT=${EXPO_PUBLIC_API_TIMEOUT:-10000}
    volumes:
      - ./mobile:/app
      - /app/node_modules   # prevent host node_modules override

volumes:
  pgdata:
  insightface_models:
