services:
  db:
    # Single-node replica set: MongoDB transactions need one.
    image: mongo:8.0.12
    container_name: hadirops_db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # From the host, connect with ?directConnection=true (the member is named "db")
      - "${DB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports its state
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'db:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: hadirops_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://db:27017/?replicaSet=rs0
      - MONGODB_DB=${DB_NAME:-hadirops}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - insightface_models:/root/.insightface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    container_name: hadirops_web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${WEB_API_BASE_URL:-/api}
      - VITE_API_PROXY_TARGET=${WEB_API_PROXY_TARGET:-http://backend:8000}
      - VITE_APP_NAME=HadirOps
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

  expo:
    build: ./mobile
    container_name: hadirops_expo
    restart: unless-stopped
    network_mode: host     # share host network — Metro detects Tailscale IP directly
    command: npx expo start --lan
    environment:
      - EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL:-auto}
      - EXPO_PUBLIC_API_PORT=${EXPO_PUBLIC_API_PORT:-8000}
      - EXPO_PUBLIC_API_TIMEOUT=${EXPO_PUBLIC_API_TIMEOUT:-10000}
    volumes:
      - ./mobile:/app
      - /app/node_modules   # prevent host node_modules override

volumes:
  mongodata:
  insightface_models:
