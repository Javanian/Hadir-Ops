name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job here writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved to other code);
# Dependabot keeps them current.
jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }}, MongoDB 9.0 replica set)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MONGODB_URL: mongodb://localhost:27017/?replicaSet=rs0
    steps:
      - name: Start MongoDB (single-node replica set, needed for transactions)
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping: 1}).ok" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # The face model files (~39 MB) for the real-model tests; the key changes
      # whenever their pinned URLs or hashes do, and each file is re-hashed on load.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/models
          key: face-models-${{ hashFiles('backend/app/services/face_models.py') }}
      # --locked: fail if uv.lock is stale; every wheel is checked against its hash.
      - run: uv sync --locked
      - run: uv run ruff check .
      # Any DeprecationWarning fails the run (see filterwarnings in pyproject.toml).
      - run: uv run pytest -q

  web:
    name: Web dashboard lint, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      # Includes @typescript-eslint/no-deprecated and the React Compiler rules.
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - name: Audit (no known vulnerability in what ships; nothing high anywhere)
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

  mobile:
    name: Mobile type check, lint, doctor and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx --yes expo-doctor@1.21.5
      # Proves the JavaScript bundle builds for a device (Hermes) without a native build.
      - run: npx expo export --platform android --output-dir /tmp/expo-android
        env:
          CI: "1"
      - run: npm audit --audit-level=high

  supply-chain:
    name: Dependency and workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Every locked backend package against OSV, which also lists malicious releases (MAL-*).
      - run: uv export --project backend --locked --no-hashes --no-emit-project --format requirements-txt > locked.txt
      - run: uvx pip-audit@2.10.1 -r locked.txt --vulnerability-service osv --strict --no-deps --disable-pip
      # Static analysis of the workflows themselves.
      - run: uvx zizmor@1.31.1 --min-severity medium .github/workflows

  images:
    name: Production images build
    needs: [backend, web, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: rollproof-backend:ci
      # The image loads both face models from /opt/face-models without a network.
      - name: Smoke test the backend image
        run: |
          docker run --rm --network none rollproof-backend:ci python -c \
            "from app.services.face_engine import FaceEngine; FaceEngine('/opt/face-models', download=False); print('face engine ok')"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          build-contexts: mobile=./mobile
          push: false
          tags: rollproof-web:ci
