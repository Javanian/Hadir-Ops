name: API reference

# Production servers do not serve /docs or /openapi.json, so the API reference
# is published here instead: the OpenAPI document straight from the code,
# rendered with Redoc, on GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/scripts/export_openapi.py"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the API reference
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Export the OpenAPI document
        run: |
          mkdir -p ../site
          uv run --no-sync python scripts/export_openapi.py ../site/openapi.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Render it with Redoc
        run: npx --yes @redocly/cli@2.71.0 build-docs ../site/openapi.json --output ../site/index.html --title "Rollproof API"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
