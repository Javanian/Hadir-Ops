services:
  db:
    # Single-host deployment. For several hosts or a managed service (MongoDB
    # Atlas on GCP or AWS), drop this service and point MONGODB_URL at it.
    image: mongo:8.0.12
    container_name: hadirops_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-hadirops}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    # Access control on a replica set needs a keyfile shared by its members:
    #   openssl rand -base64 756 > deploy/mongo-keyfile
    #   chmod 400 deploy/mongo-keyfile && sudo chown 999:999 deploy/mongo-keyfile
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile"]
    # No ports exposed to host — accessible only within Docker network
    volumes:
      - mongodata:/data/db
      - ./deploy/mongo-keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'db:27017'}]}).ok }\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: hadirops_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # Bind to localhost only — Nginx proxies externally
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://${DB_USER:-hadirops}:${DB_PASSWORD}@db:27017/?replicaSet=rs0&authSource=admin
      - MONGODB_DB=${DB_NAME:-hadirops}
      - ENVIRONMENT=production   # refuses to start with the development SECRET_KEY
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - insightface_models:/root/.insightface
    # No --reload, no source volume mount. Each worker runs the auto check-out
    # loop; a lease document in MongoDB lets only one of them work at a time.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      # 503 (database down or face model missing) makes urlopen raise
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  mongodata:
  insightface_models:
